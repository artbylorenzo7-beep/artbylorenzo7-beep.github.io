<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bashar's Atelier | Gallery</title>
<meta name="description" content="Explore Bashar Al-Taweel's curated collection of paintings, stories, and artistic worlds.">
<link rel="stylesheet" href="style.css">
<script src="artworks.js" defer></script>
</head>
<body>
<nav>
<a href="index.html">Atelier</a>
<a href="gallery.html">Gallery</a>
<a href="about.html">Artist</a>
<a href="philosophy.html">Vision</a>
<a href="journal.html">Journal</a>
</nav>
<main>
<h1>The Collection</h1>
<p class="subtitle">A living archive of memories, ideas, and painted worlds.</p>
<section class="gallery rooms" id="gallery" aria-label="Artwork collection"></section>
</main>
<script>
const gallery=document.getElementById('gallery');
artworks.forEach((artwork)=>{
 gallery.innerHTML += `
 <article class="art-card exhibition-card">
  <a href="artwork-${artwork.id}.html" aria-label="Enter ${artwork.title} exhibition room">
   <div class="artwork-media">
    <picture>
     <source srcset="${artwork.images.avif}" type="image/avif">
     <source srcset="${artwork.images.webp}" type="image/webp">
     <img loading="lazy" src="${artwork.images.fallback}" alt="${artwork.title} artwork preview">
    </picture>
   </div>
  </a>
  <div class="frame">Artwork</div>
  <h2>${artwork.title}</h2>
  <p>${artwork.details}</p>
  <p>${artwork.story}</p>
  <a class="enter" href="artwork-${artwork.id}.html">Enter Exhibition Room →</a>
 </article>`;
});

document.querySelectorAll('.artwork-media img').forEach(img=>{
 img.addEventListener('load',()=>img.classList.add('loaded'));
});
</script>
</body>
</html>
